[package]
name = "dynamite-orfs"
version = "1.1.1"
edition = "2021"
rust-version = "1.75"
# CC BY-NC 4.0 throughout: src/lib.rs refuses to compile under any other
# licence value, and tests/license.rs checks README.md and LICENSE.txt.
license = "CC-BY-NC-4.0"
authors = ["Richard Allen White III <rwhit101@charlotte.edu>"]
repository = "https://github.com/raw-lab/dynamite"
homepage = "https://github.com/raw-lab/dynamite"
readme = "README.md"
description = "An ORF / gene caller for all domains of life — phages, viruses, giant viruses, bacteria, archaea, eukaryotes and reads. Pure-Rust reimplementations of PHANOTATE, Prodigal / Prodigal-GV / -meta, GeneMark and AUGUSTUS, plus the vendored FragGeneScan HMM, with six-frame translation, codon statistics, tRNA/rRNA detection and a Prokka-style annotation bundle."
keywords = ["bioinformatics", "genomics", "gene-prediction", "orf", "annotation"]
categories = ["command-line-utilities", "science"]

# One package, two targets: the library (all the engines/utilities) and the
# `dynamite` command-line binary that drives it.
[lib]
name = "dynamite"
path = "src/lib.rs"

[[bin]]
name = "dynamite"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.5.4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rayon = "1.10"
flate2 = "1.0"
strum = "=0.21.0"
strum_macros = "=0.21.0"
thiserror = "1.0"
# Optional: RAW-lab genome-statistics crate (broader assembly metrics). Requires
# Rust 1.85+ (polars). DYNAMITE's `codon` module natively covers the RSCU / ENC /
# codon-density subset, so this is OFF by default and the default build stays light.
rustyomestats = { version = "0.2", optional = true }

[features]
default = []
rustyomestats = ["dep:rustyomestats"]

# Small, fast release binaries in the RAW-lab house style.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
